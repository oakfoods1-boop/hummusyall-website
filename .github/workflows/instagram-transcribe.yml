# Speech-to-text for reel subtitles. Triggered when integrations/instagram/transcribe-request.json changes:
# {"batch": "<ig-inbox batch>", "files": ["IMG_1.mp4"]}. Writes inbox/<batch>/<name>.words.json (word timings) to ig-inbox.
name: Instagram transcribe

on:
  push:
    branches: [main]
    paths: ['integrations/instagram/transcribe-request.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-inbox
  cancel-in-progress: false

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: pip install -q faster-whisper
      - name: Transcribe and save
        run: |
          set -o pipefail
          REQ=integrations/instagram/transcribe-request.json
          BATCH=$(jq -r .batch "$REQ"); FILES=$(jq -r '.files[]' "$REQ")
          cp integrations/instagram/transcribe.py /tmp/transcribe.py
          git config user.name "hummusyall-bot"; git config user.email "oakfoods1@gmail.com"
          git fetch -q origin +ig-inbox:refs/remotes/origin/ig-inbox
          git switch -q -c work origin/ig-inbox
          python3 -u /tmp/transcribe.py "inbox/$BATCH" $FILES 2>&1 | tee "inbox/$BATCH/transcribe.log"
          git add inbox && git commit -qm "Transcripts $BATCH" && git push -q origin HEAD:ig-inbox
      - name: Save log on failure
        if: failure()
        run: |
          BATCH=$(jq -r .batch integrations/instagram/transcribe-request.json)
          git add -f "inbox/$BATCH/transcribe.log" 2>/dev/null && git commit -qm "Transcribe log $BATCH" && git push -q origin HEAD:refs/heads/ig-logs -f || true
