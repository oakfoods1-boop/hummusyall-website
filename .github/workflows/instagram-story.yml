# Posts the "Find us at the market" Instagram story every Friday evening (about 7 PM New York time), so it is up
# for 24 hours through Saturday's markets. It lists the coming Saturday's markets
# from this week's lineup on the operations sheet Plan tab (via https://www.hummusyall.com/api/schedule).
# Run it by hand from the Actions tab: "preview" only makes the image (download it from the run page),
# "post" posts it right away. Needs the IG_ACCESS_TOKEN secret (permanent Facebook Page token).
name: Instagram Saturday story (posted Friday 7 PM)

on:
  schedule:
    - cron: '0 23 * * 5'    # UTC; the "Decide" step only posts on Friday between 7 and 10 PM New York time,
    - cron: '0 0 * * 6'     # so this covers both daylight (7 PM = 23:00 UTC) and standard time (7 PM = 00:00 UTC).
    - cron: '0 1 * * 6'     # Extra runs skip once posted.
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview = make the image only, post = post it to Instagram now'
        type: choice
        options: [preview, post]
        default: preview

permissions:
  contents: write

concurrency:
  group: instagram-story
  cancel-in-progress: false

jobs:
  story:
    runs-on: ubuntu-24.04   # pinned: Playwright browser install fails on the Ubuntu 26 "latest" image (Oct 2026)
    timeout-minutes: 25
    env:
      IG_USER_ID: '17841467835833598'
    steps:
      - uses: actions/checkout@v4

      - name: Decide
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            H=$(TZ=America/New_York date +%-H); D=$(TZ=America/New_York date +%u)
            if [ "$D" = "5" ] && [ "$H" -ge 19 ] && [ "$H" -lt 22 ]; then echo "mode=post" >> "$GITHUB_OUTPUT"; else echo "mode=skip" >> "$GITHUB_OUTPUT"; fi
          else
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.mode != 'skip'
        with:
          node-version: 22

      - name: Install browser
        if: steps.gate.outputs.mode != 'skip'
        run: npm i --no-save playwright@1.56.0 && npx playwright install --with-deps chromium

      - name: Make the story image
        id: render
        if: steps.gate.outputs.mode != 'skip'
        run: node integrations/instagram/story.mjs render

      - name: Save the image on this run's page
        if: startsWith(steps.render.outputs.status, 'rendered')
        uses: actions/upload-artifact@v4
        with:
          name: story-${{ steps.render.outputs.date }}
          path: public/ig/story-${{ steps.render.outputs.date }}.jpg

      - name: Put the image on the website
        id: publish
        if: steps.gate.outputs.mode == 'post' && startsWith(steps.render.outputs.status, 'rendered') && steps.render.outputs.posted == 'no'
        run: |
          git config user.name "hummusyall-bot"
          git config user.email "oakfoods1@gmail.com"
          git add public/ig
          git diff --cached --quiet || git commit -m "Instagram story image for ${{ steps.render.outputs.date }}"
          git pull --rebase -q origin main && git push -q origin HEAD:main

      - name: Post to Instagram
        if: steps.publish.outcome == 'success'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          node integrations/instagram/story.mjs post --date "${{ steps.render.outputs.date }}"
          git add integrations/instagram/state.json
          git diff --cached --quiet || git commit -m "Instagram story posted for ${{ steps.render.outputs.date }}"
          git pull --rebase -q origin main && git push -q origin HEAD:main
